<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <title>Đăng nhập</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="style.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase-config.js"></script>
  <style>
    .login-container { max-width:400px; margin:100px auto; padding:30px; background:#fff; border-radius:10px; box-shadow:0 4px 20px rgba(0,0,0,0.1); }
    h2 { color:#c8102e; text-align:center; margin-bottom:20px; }
    input { width:100%; padding:12px; margin:10px 0; border:1px solid #ddd; border-radius:6px; }
    button { width:100%; padding:12px; background:#c8102e; color:white; border:none; border-radius:6px; cursor:pointer; font-weight:bold; }
    button:hover { background:#a80d24; }
    #msg { color:red; text-align:center; margin-top:10px; }
  </style>
</head>
<body>
  <div class="login-container">
    <h2>Đăng nhập</h2>
    <p style="text-align:center;">Dùng email và mật khẩu admin đã tạo trong Supabase Authentication.</p>
    <form id="loginForm">
      <input type="email" id="email" placeholder="Email quản trị" autocomplete="username" required>
      <input type="password" id="password" placeholder="Mật khẩu" autocomplete="current-password" required>
      <button id="loginButton" type="submit">Đăng nhập</button>
    </form>
    <p id="msg" role="status" aria-live="polite"></p>
  </div>

  <script>
    document.getElementById("loginForm").addEventListener("submit", async event => {
      event.preventDefault();
      const email = document.getElementById("email").value.trim();
      const password = document.getElementById("password").value;
      const msg = document.getElementById("msg");
      const button = document.getElementById("loginButton");
      let signedInUserId = "";

      if (window.supabaseSetupError || !window.supabaseClient) {
        msg.textContent = window.supabaseSetupError || "Supabase chưa được cấu hình.";
        return;
      }

      button.disabled = true;
      msg.textContent = "Đang đăng nhập...";
      try {
        const { data, error } = await window.supabaseClient.auth.signInWithPassword({ email, password });
        if (error) throw error;
        signedInUserId = data.user.id;

        const { data: admin, error: roleError } = await window.supabaseClient
          .from("admin_users")
          .select("user_id")
          .eq("user_id", data.user.id)
          .maybeSingle();
        if (roleError) throw roleError;
        if (!admin) {
          await window.supabaseClient.auth.signOut();
          throw new Error("Tài khoản này chưa được cấp quyền quản trị.");
        }
        window.location.href = "admin.html";
      } catch (error) {
        if (signedInUserId) await window.supabaseClient.auth.signOut();
        msg.textContent = error.message || "Đăng nhập thất bại.";
      } finally {
        button.disabled = false;
      }
    });
  </script>
</body>
</html>
